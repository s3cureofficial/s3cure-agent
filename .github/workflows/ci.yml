# S3cure Agent: Tests, echte Installation auf Ubuntu (systemd) mit Probe, Paket s3cure-agent.tar.gz.
# Tag v* (z. B. v1.0.0): GitHub-Release mit dem Paket, Text aus CHANGELOG.md.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Abhängigkeiten, Syntax, Tests
        run: |
          npm ci --no-audit --no-fund
          for f in lib/*.js bin/*.js public/*.js test/*.js; do node --check "$f"; done
          bash -n install.sh
          npm test

      - name: Paket bauen (s3cure-agent.tar.gz)
        run: |
          mkdir -p dist/pkg/s3cure-agent
          cp -a bin lib public package.json package-lock.json install.sh README.md LICENSE dist/pkg/s3cure-agent/
          tar czf dist/s3cure-agent.tar.gz -C dist/pkg s3cure-agent
          (cd dist && sha256sum s3cure-agent.tar.gz > s3cure-agent.tar.gz.sha256)
          ls -la dist/s3cure-agent.tar.gz dist/s3cure-agent.tar.gz.sha256

      - name: Echte Installation aus dem Paket und Probe
        run: |
          mkdir -p /tmp/probe && tar xzf dist/s3cure-agent.tar.gz -C /tmp/probe
          sudo env "PATH=$PATH" /tmp/probe/s3cure-agent/install.sh
          printf 'probe-passwort-123\n' | sudo env "PATH=$PATH" s3cure-agent user add probe --admin --password-stdin >/dev/null
          sudo env "PATH=$PATH" node test/probe.js probe probe-passwort-123
          # Update: erneut installieren, Benutzer bleibt
          sudo env "PATH=$PATH" /tmp/probe/s3cure-agent/install.sh >/dev/null
          sudo env "PATH=$PATH" s3cure-agent user list | grep -q '^probe'

      - uses: actions/upload-artifact@v4
        with:
          name: s3cure-agent
          path: |
            dist/s3cure-agent.tar.gz
            dist/s3cure-agent.tar.gz.sha256
          if-no-files-found: error

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: s3cure-agent
          path: dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Abschnitt der Version aus CHANGELOG.md
          awk -v v="$V" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "S3cure Agent $V" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/s3cure-agent.tar.gz dist/s3cure-agent.tar.gz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/s3cure-agent.tar.gz dist/s3cure-agent.tar.gz.sha256 --title "S3cure Agent $V" --notes-file notes.md
          fi
